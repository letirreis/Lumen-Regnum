<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumen Regnum - Campaign Manager</title>
    
    <!-- Fonts: Cinzel (Arcane Titles) & Inter (Clean UI) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              // Paleta Primária
              obsidian: '#0E0E11',    // Antracito Obsidiana (Background)
              shadow: '#16161C',      // Tinta de Sombra (Cards/Panels)
              
              // Luz Arcana (Accents)
              gold: {
                DEFAULT: '#D4B875',   // Ouro Nebuloso
                dim: '#8A7545',
                glow: '#F0D696'
              },
              violet: {
                DEFAULT: '#6E51A3',   // Violeta Etéreo
                dark: '#4A3275',
                light: '#9176C7'
              },
              silver: '#E2E4E9',      // Platina (Text)
              
              // Mistério
              twilight: '#2D3F57',    // Azul Crepúsculo
            },
            fontFamily: {
              cinzel: ['Cinzel', 'serif'],
              sans: ['Inter', 'sans-serif'],
            },
            boxShadow: {
              'arcane': '0 0 15px -3px rgba(110, 81, 163, 0.3)', // Violet glow
              'gold': '0 0 10px -2px rgba(212, 184, 117, 0.2)', // Gold glow
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #0E0E11;
        /* Vignette + Luz Central Sutil */
        background-image: radial-gradient(circle at center, #101018 0%, #050509 55%, #020206 100%);
        background-attachment: fixed;
        color: #E2E4E9;
        font-family: 'Inter', sans-serif;
        min-height: 100vh;
      }

      /* Poeira Arcana (Dust Texture) */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0.25;
        background-image: 
            radial-gradient(1px 1px at 20% 20%, #ffffff55 0, transparent 100%),
            radial-gradient(1px 1px at 80% 40%, #C2A86C55 0, transparent 100%),
            radial-gradient(1px 1px at 10% 80%, #6E51A355 0, transparent 100%),
            radial-gradient(1px 1px at 50% 50%, #ffffff33 0, transparent 100%),
            radial-gradient(1px 1px at 90% 10%, #C2A86C33 0, transparent 100%);
        background-size: 100% 100%;
        z-index: 0;
      }
      
      h1, h2, h3, h4, h5, h6 {
        font-family: 'Cinzel', serif;
        letter-spacing: 0.05em;
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #0E0E11; 
      }
      ::-webkit-scrollbar-thumb {
        background: #2D3F57;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #6E51A3;
      }

      ::selection {
        background: #6E51A3;
        color: white;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.555.0",
    "react-router-dom": "https://aistudiocdn.com/react-router-dom@^7.9.6",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "@supabase/supabase-js": "https://aistudiocdn.com/@supabase/supabase-js@^2.86.0"
  }
}
</script>
</head>
  <body>
    <div id="root" class="relative z-10"></div>
  </body>
</html>
