<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumen Regnum - Campaign Manager</title>
    
    <!-- Fonts: Cinzel (Arcane Titles) & Inter (Clean UI) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              // Paleta Primária
              obsidian: '#1A1B23',    // Gunmetal Deep (Background - Lighter for visibility)
              shadow: '#13141A',      // Darker Ink (Cards/Panels - For Contrast)
              
              // Luz Arcana (Accents)
              gold: {
                DEFAULT: '#D4B875',   // Ouro Nebuloso
                dim: '#8A7545',
                glow: '#F0D696'
              },
              violet: {
                DEFAULT: '#6E51A3',   // Violeta Etéreo
                dark: '#4A3275',
                light: '#9176C7'
              },
              silver: '#FFFFFF',      // Pure White for max readability
              
              // Mistério
              twilight: '#2D3F57',    // Azul Crepúsculo
            },
            fontFamily: {
              cinzel: ['Cinzel', 'serif'],
              sans: ['Inter', 'sans-serif'],
            },
            boxShadow: {
              'arcane': '0 0 15px -3px rgba(110, 81, 163, 0.3)', // Violet glow
              'gold': '0 0 10px -2px rgba(212, 184, 117, 0.2)', // Gold glow
            },
            animation: {
                'snow': 'arcaneSnow 20s linear infinite',
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #1A1B23;
        color: #FFFFFF;
        font-family: 'Inter', sans-serif;
        min-height: 100vh;
        overflow-x: hidden;
      }

      /* Arcane Snow Animation */
      @keyframes arcaneSnow {
        0% { background-position: 0 0, 0 0, 0 0; }
        100% { background-position: 0 500px, 0 400px, 0 300px; }
      }

      /* The Falling Flakes Texture */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0.4; 
        /* Three layers of dots: White (Snow), Gold (Magic), Violet (Arcane) */
        background-image: 
            radial-gradient(2px 2px at 20% 30%, #ffffff 50%, transparent 100%),
            radial-gradient(2px 2px at 40% 70%, #ffffff 50%, transparent 100%),
            radial-gradient(2px 2px at 60% 20%, #ffffff 50%, transparent 100%),
            radial-gradient(1.5px 1.5px at 80% 40%, #C2A86C 50%, transparent 100%),
            radial-gradient(2px 2px at 10% 80%, #6E51A3 50%, transparent 100%),
            radial-gradient(1.5px 1.5px at 90% 10%, #C2A86C 50%, transparent 100%);
        background-size: 500px 500px, 400px 400px, 300px 300px;
        animation: arcaneSnow 30s linear infinite;
        z-index: 0;
      }
      
      h1, h2, h3, h4, h5, h6 {
        font-family: 'Cinzel', serif;
        letter-spacing: 0.05em;
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #1A1B23; 
      }
      ::-webkit-scrollbar-thumb {
        background: #2D3F57;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #6E51A3;
      }

      ::selection {
        background: #6E51A3;
        color: white;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.555.0",
    "react-router-dom": "https://aistudiocdn.com/react-router-dom@^7.9.6",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "@supabase/supabase-js": "https://aistudiocdn.com/@supabase/supabase-js@^2.86.0"
  }
}
</script>
</head>
  <body>
    <div id="root" class="relative z-10"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
